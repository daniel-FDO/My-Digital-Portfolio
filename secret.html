<!DOCTYPE html>
<html lang="en" class="fp-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Hidden page: keep it out of search engines -->
  <meta name="robots" content="noindex, nofollow" />
  <title>daniel.</title>

  <!-- GATE — runs before anything is drawn.
       Only a click on a folder card (index.html) leaves the one-time
       "pass" in sessionStorage. No pass (URL typed / pasted / refreshed)
       → straight back to the home page. The pass is used up here.
       NOTE: a soft, client-side lock — fine for a hidden page, not for
       anything truly private. -->
  <script>
    (function () {
      if (new URLSearchParams(location.search).get('folder') === 'interests') { location.replace('index.html#gallery'); return; }
      var ok = false;
      try {
        ok = sessionStorage.getItem('secret-pass') === '1';
        sessionStorage.removeItem('secret-pass');                 // one click = one visit
        var colour = sessionStorage.getItem('secret-colour');     // the card's colour, for the intro
        if (colour) document.documentElement.style.setProperty('--enter', colour);
        // Same theme as the visit it came from (night unless light was picked)
        document.documentElement.dataset.theme = sessionStorage.getItem('theme') === 'light' ? 'light' : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      if (!ok) {
        document.documentElement.style.display = 'none';          // draw nothing
        location.replace('index.html');                           // replace = no history entry
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wdth,wght@62..100,900&display=swap" rel="stylesheet" />
  <!-- Geist + Geist Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/secret.css" />
  <link rel="stylesheet" href="/src/styles/buttons.css" />
  <link rel="stylesheet" href="/src/styles/cursors.css" />
  <!-- About folder only (every rule is scoped to .page-about) -->
  <link rel="stylesheet" href="/src/styles/about.css" />
  <link rel="stylesheet" href="/src/styles/dossier.css" />
  <style>#root { display: contents; }</style>
</head>
<!-- "fp" = folder page: every rule in secret.css is scoped to it
     (the home page uses the same class for its in-place folder view) -->
<body class="fp">
  <!-- The veil, header and story: SecretPage.tsx (content in src/data/folders.ts) -->
  <div id="root"></div>
  <script type="module" src="/src/secret.tsx"></script>
</body>
</html>
