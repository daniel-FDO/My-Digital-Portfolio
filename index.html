  <!-- THEME, set before the page draws (no flash).
       A fresh visit or reload starts dark; a choice made with the toolbar's
       theme button lasts for this visit (sessionStorage), so opening a
       folder, Back / Forward and secret.html all keep it. src/lib/theme.tsx. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        var sameSite = false;
        try { sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
        if ((nav && nav.type === 'back_forward') || sameSite) {
          if (sessionStorage.getItem('theme') === 'light') theme = 'light';
        } else {
          sessionStorage.setItem('theme', 'dark');
        }
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- PRELOADER: shown once per tab, on the first visit to this page —
       not on reload, Back / Forward, or arriving from another page of
       the site. html.pl-on turns it on (preloader.css / src/lib/preloader.ts).
       No JavaScript → no class → no loader. If the app never runs,
       the loader steps aside at 5s. -->
  <script>
    (function () {
      var root = document.documentElement, show = false;
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        var sameSite = false;
        try { sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
        show = !(nav && nav.type === 'back_forward') && !sameSite && sessionStorage.getItem('introSeen') !== '1';
        if (show) sessionStorage.setItem('introSeen', '1');
      } catch (e) { show = false; }
      if (!show) return;
      root.classList.add('pl-on');
      setTimeout(function () {
        if (window.Preloader) return;
        var l = document.getElementById('pl');
        if (l) l.remove();
        root.classList.remove('pl-on');
      }, 5000);
    })();
  </script>
  <link rel="stylesheet" href="/src/styles/preloader.css" />
